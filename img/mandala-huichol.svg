<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Mandala inspirado en el arte huichol</title>
  <g transform="translate(200 200)">
    <!-- rayos exteriores -->
    <g fill="#f08a1c">
      <polygon points="0,-190 14,-150 -14,-150"/>
      <polygon points="0,-190 14,-150 -14,-150" transform="rotate(45)"/>
      <polygon points="0,-190 14,-150 -14,-150" transform="rotate(90)"/>
      <polygon points="0,-190 14,-150 -14,-150" transform="rotate(135)"/>
      <polygon points="0,-190 14,-150 -14,-150" transform="rotate(180)"/>
      <polygon points="0,-190 14,-150 -14,-150" transform="rotate(225)"/>
      <polygon points="0,-190 14,-150 -14,-150" transform="rotate(270)"/>
      <polygon points="0,-190 14,-150 -14,-150" transform="rotate(315)"/>
    </g>
    <!-- puntos exteriores -->
    <g fill="#fbf5ea">
      <circle cx="0" cy="-168" r="4" transform="rotate(22.5)"/>
      <circle cx="0" cy="-168" r="4" transform="rotate(67.5)"/>
      <circle cx="0" cy="-168" r="4" transform="rotate(112.5)"/>
      <circle cx="0" cy="-168" r="4" transform="rotate(157.5)"/>
      <circle cx="0" cy="-168" r="4" transform="rotate(202.5)"/>
      <circle cx="0" cy="-168" r="4" transform="rotate(247.5)"/>
      <circle cx="0" cy="-168" r="4" transform="rotate(292.5)"/>
      <circle cx="0" cy="-168" r="4" transform="rotate(337.5)"/>
    </g>
    <circle r="146" fill="none" stroke="#c9993a" stroke-width="3"/>
    <circle r="138" fill="none" stroke="#fbf5ea" stroke-width="2" stroke-dasharray="3 8"/>
    <!-- cuadrados concéntricos rotados -->
    <rect x="-110" y="-110" width="220" height="220" fill="#d6247a"/>
    <rect x="-110" y="-110" width="220" height="220" fill="#12a5a0" transform="rotate(45)"/>
    <rect x="-84" y="-84" width="168" height="168" fill="#14101a"/>
    <rect x="-84" y="-84" width="168" height="168" fill="#f08a1c" transform="rotate(45)"/>
    <rect x="-62" y="-62" width="124" height="124" fill="#2b5fb4"/>
    <rect x="-62" y="-62" width="124" height="124" fill="#d23b2e" transform="rotate(45)"/>
    <rect x="-42" y="-42" width="84" height="84" fill="#fbf5ea"/>
    <rect x="-42" y="-42" width="84" height="84" fill="#3f9d4f" transform="rotate(45)"/>
    <!-- ojo de dios central -->
    <circle r="26" fill="#14101a"/>
    <circle r="19" fill="#c9993a"/>
    <circle r="12" fill="#d6247a"/>
    <circle r="5" fill="#fbf5ea"/>
  </g>
</svg>
